name: Assemble pack parts
on:
  push:
    paths:
      - "_pack_chunks/**"
      - ".github/workflows/assemble-pack.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify chunked b64 decodes to 122436
        run: |
          set -euo pipefail
          cat _pack_chunks/p?? | tr -d '\n' | base64 -d > /tmp/check.pck
          test "$(wc -c < /tmp/check.pck)" -eq 122436
          echo "chunks decode to 122436"
