name: Assemble pack parts
on:
  push:
    paths:
      - "_pack_chunks/**"
      - ".github/workflows/assemble-pack.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/city-pck-122436'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble slices if complete
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          for name in ['p00','p01','p02','p04']:
              parts = [Path(f'_pack_chunks/_slices/{name}.{i:02d}') for i in range(19)]
              if not all(p.exists() for p in parts):
                  print('incomplete', name)
                  continue
              data = b''.join(p.read_bytes().replace(b'\n', b'') for p in parts)
              assert len(data) == 13604, (name, len(data))
              dest = Path(f'_pack_chunks/{name}')
              dest.write_bytes(data)
              print('assembled', name, len(data))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _pack_chunks/p00 _pack_chunks/p01 _pack_chunks/p02 _pack_chunks/p04
          if git diff --cached --quiet; then
            echo no assembled changes
          else
            git commit -m "Assemble exact pack chunks from verified 716-char slices"
            git push
          fi
      - name: Verify concat decodes to 122436
        run: |
          set -euo pipefail
          cat _pack_chunks/p?? | tr -d '\n' | base64 -d > /tmp/check.pck
          test "$(wc -c < /tmp/check.pck)" -eq 122436
          echo chunks decode to 122436
