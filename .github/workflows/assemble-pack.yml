name: Assemble pack parts
on:
  push:
    paths:
      - "_pack_chunks/**"
      - ".github/workflows/assemble-pack.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch campaign b64 parts from last good commit
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          src = '130c711d0e8bf10c8a35f6f4dfce73a03ea1950c'

          def show(path):
              return bytearray(subprocess.check_output(['git', 'show', f'{src}:{path}']))

          p0 = show('index.pck.b64.0')
          p1 = show('index.pck.b64.1')
          p2 = show('index.pck.b64.2')
          p3 = show('index.pck.b64.3')
          p4 = show('index.pck.b64.4')
          if len(p0) != 28000 or bytes(p0[19354:19355]) != b'z':
              raise SystemExit(f'unexpected p0 {len(p0)} {bytes(p0[19354:19355])!r}')
          p0[19354] = ord('Z')
          if len(p2) != 28000 or bytes(p2[27474:27475]) != b'L':
              raise SystemExit(f'unexpected p2 {len(p2)} {bytes(p2[27474:27475])!r}')
          p2[27474] = ord('r')
          if bytes(p3[16214:16222]) != b'UXsg7Ft4':
              raise SystemExit(f'unexpected p3 {bytes(p3[16214:16222])!r}')
          p3[16214] = ord('k')
          p3[16216] = ord('8')
          p3[16217] = ord('o')
          p3[16218] = ord('6')
          p3[16220] = ord('N')
          p3[16221] = ord('8')
          b0, b1, b2, b3, b4 = bytes(p0), bytes(p1), bytes(p2), bytes(p3), bytes(p4)
          Path('index.pck.b64.0').write_bytes(b0)
          Path('index.pck.b64.1').write_bytes(b1)
          Path('index.pck.b64.2').write_bytes(b2)
          Path('index.pck.b64.3').write_bytes(b3)
          Path('index.pck.b64.4').write_bytes(b4)
          Path('index.pck.b64').write_bytes(b0 + b1 + b2 + b3 + b4)
          print(len(b0), len(b1), len(b2), len(b3), len(b4), len(b0+b1+b2+b3+b4))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck.b64.0 index.pck.b64.1 index.pck.b64.2 index.pck.b64.3 index.pck.b64.4 index.pck.b64
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Campaign index.pck base64 parts (101220 bytes)."
            git push
          fi
