name: Fix fig slices
on:
  push:
    branches: [main]
    paths:
      - "_pack_chunks/fig.*"
      - "_pack_chunks/_fix_fig_slices.py"
      - ".github/workflows/fix-fig-slices.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unique fig slice repairs
        run: python3 _pack_chunks/_fix_fig_slices.py
      - name: Commit repaired slices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _pack_chunks/fig.00 _pack_chunks/fig.01 _pack_chunks/fig.02 _pack_chunks/fig.03 _pack_chunks/fig.04 _pack_chunks/fig.05 _pack_chunks/fig.06 _pack_chunks/fig.07
          if git diff --cached --quiet; then
            echo no fig changes
          else
            git commit -m "Fix fig.00-fig.07 bsdiff slices to match local."
            git push
          fi
