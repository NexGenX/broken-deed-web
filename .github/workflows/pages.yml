name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake index.pck
        run: |
          set -euo pipefail
          if ls _pack_chunks/s???? >/dev/null 2>&1; then
            cat _pack_chunks/s???? | tr -d '\n' | base64 -d > index.pck
            test "$(wc -c < index.pck)" -eq 610968
          elif ls _pack_chunks/p?? >/dev/null 2>&1; then
            cat _pack_chunks/p?? | tr -d '\n' | base64 -d > index.pck
          elif [ -f index.pck.b64 ]; then
            tr -d '\n' < index.pck.b64 | base64 -d > index.pck
          else
            cat index.pck.b64.[0-9]* | tr -d '\n' | base64 -d > index.pck
          fi
          echo "pck bytes $(wc -c < index.pck)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck
          if git diff --cached --quiet; then
            echo "pck unchanged"
          else
            git commit -m "Bake campaign index.pck ($(wc -c < index.pck))."
            git push
          fi
          git push origin HEAD:gh-pages --force || echo "gh-pages push skipped"
  deploy:
    needs: bake
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          if ls _pack_chunks/s???? >/dev/null 2>&1; then
            cat _pack_chunks/s???? | tr -d '\n' | base64 -d > index.pck
            test "$(wc -c < index.pck)" -eq 610968
          elif ls _pack_chunks/p?? >/dev/null 2>&1; then
            cat _pack_chunks/p?? | tr -d '\n' | base64 -d > index.pck
          elif [ -f index.pck.b64 ]; then
            tr -d '\n' < index.pck.b64 | base64 -d > index.pck
          elif ls index.pck.b64.[0-9]* >/dev/null 2>&1; then
            cat index.pck.b64.[0-9]* | tr -d '\n' | base64 -d > index.pck
          fi
          cp -a index.html index.js index.wasm index.pck index.png index.icon.png index.apple-touch-icon.png index.audio.worklet.js index.audio.position.worklet.js .nojekyll _site/ 2>/dev/null || true
          test -f _site/index.html
          test -f _site/index.wasm
          test -f _site/index.pck
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
