name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake vale gate-keep index.pck
        run: |
          set -euo pipefail
          python3 -m pip install --user bsdiff4
          python3 _pack_chunks/apply_fix.py
          sed -i 's/"index.pck":635736/"index.pck":640120/; s/"index.pck":637608/"index.pck":640120/; s/"index.pck":637560/"index.pck":640120/' index.html
          echo "pck bytes $(wc -c < index.pck)"
          test "$(wc -c < index.pck)" -eq 640120
          test "$(sha256sum index.pck | awk '{print $1}')" = "356513ae91fd8232ad08af590d959917bc0d70d003aa79e32f109469813a8036"
          grep -q 'index.pck":640120' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck index.html
          if git diff --cached --quiet; then
            echo "pck unchanged"
          else
            git commit -m "Bake vale gate-keep index.pck (640120)."
            git push
          fi
  publish-gh-pages:
    needs: bake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish html and pck to gh-pages
        run: |
          set -euo pipefail
          python3 -m pip install --user bsdiff4
          (cd main && python3 _pack_chunks/apply_fix.py)
          sed -i 's/"index.pck":635736/"index.pck":640120/; s/"index.pck":637608/"index.pck":640120/; s/"index.pck":637560/"index.pck":640120/' main/index.html
          test "$(wc -c < main/index.pck)" -eq 640120
          test "$(sha256sum main/index.pck | awk '{print $1}')" = "356513ae91fd8232ad08af590d959917bc0d70d003aa79e32f109469813a8036"
          cp -f main/index.html main/index.pck pages/
          grep -q 'index.pck":640120' pages/index.html
          test "$(wc -c < pages/index.pck)" -eq 640120
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add index.html index.pck
          if git -C pages diff --cached --quiet; then
            echo "gh-pages unchanged"
          else
            git -C pages commit -m "Ship vale gate-keep pack 640120."
            git -C pages push origin gh-pages
          fi
