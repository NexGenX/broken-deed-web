name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake Codex board index.pck
        run: |
          set -euo pipefail
          python3 -m pip install --user bsdiff4
          python3 _pack_chunks/apply_fix.py
          sed -i 's/"index.pck":635736/"index.pck":637560/; s/"index.pck":637608/"index.pck":637560/' index.html
          echo "pck bytes $(wc -c < index.pck)"
          test "$(wc -c < index.pck)" -eq 637560
          test "$(sha256sum index.pck | awk '{print $1}')" = "14ef14b849b14f50dac9c5fd21027e52173d8098eb0c9f3fc58df1261d2d1c8d"
          grep -q 'index.pck":637560' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck index.html
          if git diff --cached --quiet; then
            echo "pck unchanged"
          else
            git commit -m "Bake Codex board index.pck (637560)."
            git push
          fi
  publish-gh-pages:
    needs: bake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish html and pck to gh-pages
        run: |
          set -euo pipefail
          python3 -m pip install --user bsdiff4
          (cd main && python3 _pack_chunks/apply_fix.py)
          sed -i 's/"index.pck":635736/"index.pck":637560/; s/"index.pck":637608/"index.pck":637560/' main/index.html
          test "$(wc -c < main/index.pck)" -eq 637560
          test "$(sha256sum main/index.pck | awk '{print $1}')" = "14ef14b849b14f50dac9c5fd21027e52173d8098eb0c9f3fc58df1261d2d1c8d"
          cp -f main/index.html main/index.pck pages/
          grep -q 'index.pck":637560' pages/index.html
          test "$(wc -c < pages/index.pck)" -eq 637560
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add index.html index.pck
          if git -C pages diff --cached --quiet; then
            echo "gh-pages unchanged"
          else
            git -C pages commit -m "Ship Codex board pack 637560."
            git -C pages push origin gh-pages
          fi
