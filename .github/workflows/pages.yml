name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake next-cut index.pck
        run: |
          set -euo pipefail
          if ls _pack_chunks/c?? >/dev/null 2>&1; then
            cat _pack_chunks/c?? | tr -d '\n' | base64 -d > index.pck
          elif ls _pack_chunks/p?? >/dev/null 2>&1; then
            cat _pack_chunks/p?? | tr -d '\n' | base64 -d > index.pck
          elif [ -f index.pck.b64 ]; then
            tr -d '\n' < index.pck.b64 | base64 -d > index.pck
          else
            cat index.pck.b64.[0-9]* | tr -d '\n' | base64 -d > index.pck
          fi
          python3 _pack_chunks/apply_fix.py
          echo "pck bytes $(wc -c < index.pck)"
          test "$(wc -c < index.pck)" -eq 635736
          test "$(sha256sum index.pck | awk '{print $1}')" = "c1f6ca51b9631633ca80918c5e11bed27d8fc5fc415c0e9e84c166650e063844"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck
          if git diff --cached --quiet; then
            echo "pck unchanged"
          else
            git commit -m "Bake next-cut index.pck (635736)."
            git push
          fi
  deploy:
    needs: bake
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          if ls _pack_chunks/c?? >/dev/null 2>&1; then
            cat _pack_chunks/c?? | tr -d '\n' | base64 -d > index.pck
          elif ls _pack_chunks/p?? >/dev/null 2>&1; then
            cat _pack_chunks/p?? | tr -d '\n' | base64 -d > index.pck
          elif [ -f index.pck.b64 ]; then
            tr -d '\n' < index.pck.b64 | base64 -d > index.pck
          elif ls index.pck.b64.[0-9]* >/dev/null 2>&1; then
            cat index.pck.b64.[0-9]* | tr -d '\n' | base64 -d > index.pck
          fi
          python3 _pack_chunks/apply_fix.py
          test "$(wc -c < index.pck)" -eq 635736
          test "$(sha256sum index.pck | awk '{print $1}')" = "c1f6ca51b9631633ca80918c5e11bed27d8fc5fc415c0e9e84c166650e063844"
          cp -a index.html index.js index.wasm index.pck index.png index.icon.png index.apple-touch-icon.png index.audio.worklet.js index.audio.position.worklet.js .nojekyll _site/
          test -f _site/index.html
          test -f _site/index.wasm
          test "$(wc -c < _site/index.pck)" -eq 635736
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
