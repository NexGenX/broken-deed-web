name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake Rally/Mend index.pck
        run: |
          set -euo pipefail
          python3 -m pip install --user bsdiff4
          python3 _pack_chunks/apply_fix.py
          echo "pck bytes $(wc -c < index.pck)"
          test "$(wc -c < index.pck)" -eq 637608
          test "$(sha256sum index.pck | awk '{print $1}')" = "56f9f47e411bb8135d64441e52719304e7dff943857856bf5f88755f43639768"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck
          if git diff --cached --quiet; then
            echo "pck unchanged"
          else
            git commit -m "Bake Rally/Mend index.pck (637608)."
            git push
          fi
  publish-gh-pages:
    needs: bake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Publish html and pck to gh-pages
        run: |
          set -euo pipefail
          python3 -m pip install --user bsdiff4
          (cd main && python3 _pack_chunks/apply_fix.py)
          test "$(wc -c < main/index.pck)" -eq 637608
          test "$(sha256sum main/index.pck | awk '{print $1}')" = "56f9f47e411bb8135d64441e52719304e7dff943857856bf5f88755f43639768"
          cp -f main/index.html main/index.pck pages/
          grep -q 'index.pck":637608' pages/index.html
          test "$(wc -c < pages/index.pck)" -eq 637608
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add index.html index.pck
          if git -C pages diff --cached --quiet; then
            echo "gh-pages unchanged"
          else
            git -C pages commit -m "Ship Rally/Mend pack 637608."
            git push origin gh-pages
          fi
