name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake next-cut index.pck
        run: |
          set -euo pipefail
          python3 -m pip install --user bsdiff4
          python3 _pack_chunks/apply_fix.py
          echo "pck bytes $(wc -c < index.pck)"
          test "$(wc -c < index.pck)" -eq 635736
          test "$(sha256sum index.pck | awk '{print $1}')" = "c1f6ca51b9631633ca80918c5e11bed27d8fc5fc415c0e9e84c166650e063844"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck
          if git diff --cached --quiet; then
            echo "pck unchanged"
          else
            git commit -m "Bake next-cut index.pck (635736)."
            git push
          fi
  publish-gh-pages:
    needs: bake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish site to gh-pages
        run: |
          set -euo pipefail
          python3 -m pip install --user bsdiff4
          python3 _pack_chunks/apply_fix.py
          test "$(wc -c < index.pck)" -eq 635736
          test "$(sha256sum index.pck | awk '{print $1}')" = "c1f6ca51b9631633ca80918c5e11bed27d8fc5fc415c0e9e84c166650e063844"
          mkdir -p /tmp/site
          cp -a index.html index.js index.wasm index.pck index.png index.icon.png index.apple-touch-icon.png index.audio.worklet.js index.audio.position.worklet.js .nojekyll /tmp/site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          cp -a /tmp/site/.
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages unchanged"
          else
            git commit -m "Ship next-cut pack 635736."
            git push origin gh-pages
          fi
