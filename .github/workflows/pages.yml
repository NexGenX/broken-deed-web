name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake index.pck 68176
        run: |
          set -euo pipefail
          cat index.pck.b64* | tr -d '\n' | base64 -d > index.pck
          test "$(wc -c < index.pck)" -eq 68176
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pck
          if git diff --cached --quiet; then
            echo "already 68176"
          else
            git commit -m "Bake Vess grind index.pck (68176)."
            git push
          fi
  deploy:
    needs: bake
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          set -euo pipefail
          mkdir _site
          for f in index.html index.js index.wasm index.pck index.png index.icon.png index.apple-touch-icon.png index.audio.worklet.js index.audio.position.worklet.js .nojekyll; do
            if [ -f "$f" ]; then cp -a "$f" _site/; fi
          done
          if ls index.pck.b64* >/dev/null 2>&1; then
            cat index.pck.b64* | tr -d '\n' | base64 -d > _site/index.pck
          fi
          test "$(wc -c < _site/index.pck)" -eq 68176
          test -s _site/index.html
          test -s _site/index.wasm
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
