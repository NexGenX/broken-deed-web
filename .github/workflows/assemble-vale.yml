name: Assemble vale pack chunks
on:
  push:
    paths:
      - "_pack_chunks/_h/**"
      - ".github/workflows/assemble-vale.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble p00-p39 from quarters
        run: |
          set -euo pipefail
          missing=0
          for i in $(seq -w 0 39); do
            if [ -f "_pack_chunks/_h/p${i}.0" ] && [ -f "_pack_chunks/_h/p${i}.1" ] && [ -f "_pack_chunks/_h/p${i}.2" ] && [ -f "_pack_chunks/_h/p${i}.3" ]; then
              cat "_pack_chunks/_h/p${i}.0" "_pack_chunks/_h/p${i}.1" "_pack_chunks/_h/p${i}.2" "_pack_chunks/_h/p${i}.3" > "_pack_chunks/p${i}"
            else
              echo "missing quarters for p${i}"
              missing=1
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _pack_chunks/p[0-9][0-9]
          if git diff --cached --quiet; then
            echo "no new assembled chunks"
          else
            git commit -m "Assemble vale pack chunks from quarters."
            git push
          fi
          if [ "$missing" -eq 0 ]; then
            echo "assembled ascii $(cat _pack_chunks/p?? | tr -d '\n' | wc -c)"
            test "$(cat _pack_chunks/p?? | tr -d '\n' | base64 -d | wc -c)" -eq 2667096
          else
            echo "not all quarters present yet"
          fi
